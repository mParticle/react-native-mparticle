name: 'Build and Test'

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  id-token: write

jobs:
  trunk-check:
    name: 'Trunk Check'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install node modules
        run: yarn install --frozen-lockfile
      - name: Trunk Check
        uses: trunk-io/trunk-action@v1

  js-tests:
    name: 'JS Tests'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: 'Install node modules'
        run: |
          yarn install

      - name: 'Run test'
        run: |
          yarn test

  android-unit-tests:
    name: 'Android Unit Tests'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Run Android Unit Tests'
        working-directory: android
        run: ./gradlew test

  android-lint:
    name: 'Android Lint'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Run Android lint'
        working-directory: android
        run: ./gradlew lint

  android-kotlin-lint:
    name: 'Android kotlin lint'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Run Android kotlin lint'
        working-directory: android
        run: ./gradlew ktlintCheck

  android-sample-app:
    name: Android Sample App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install node modules
        run: yarn install

      - name: Build package
        run: yarn dev:pack

      - name: Install sample app dependencies
        working-directory: sample
        run: |
          rm -f yarn.lock
          # Yarn 1 keeps its unpacked copy of a local .tgz under .tmp in the restored cache, keyed
          # only by the file's path, so without this the sample installs an old build of this package.
          rm -rf "$(yarn cache dir)/.tmp"
          yarn install

      - name: Run Android sample app
        working-directory: sample/android
        run: ./gradlew assembleDebug

  ios-sample-app:
    # The CocoaPods leg keeps the display name the "main" ruleset requires ("iOS Sample App").
    name: ${{ matrix.check_name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios_deps: cocoapods
            check_name: iOS Sample App
          - ios_deps: spm
            check_name: iOS Sample App (SPM)
    env:
      # sample/ios/Podfile takes the mParticle SDKs from Swift Package Manager unless this is 1.
      MP_USE_COCOAPODS: ${{ matrix.ios_deps == 'cocoapods' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          # Avoid `latest-stable` (Xcode 17+ / Swift 6 defaults) breaking RoktUXHelper
          # source builds until Rokt pins are updated upstream.
          xcode-version: '^16.0.0'

      - name: Set Xcode Toolchain
        run: echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> $GITHUB_ENV

      - name: Setup iOS Simulator
        uses: futureware-tech/simulator-action@v5
        id: simulator
        with:
          model: iPhone 16
          os: iOS
          os_version: '>=18.0'
          wait_for_boot: true
          shutdown_after_job: true

      - name: Install node modules
        run: yarn install

      - name: Build package
        run: yarn dev:pack

      - name: Install sample app dependencies
        working-directory: sample
        run: |
          rm -f yarn.lock
          # Yarn 1 keeps its unpacked copy of a local .tgz under .tmp in the restored cache, keyed
          # only by the file's path, so without this the sample installs an old build of this package.
          rm -rf "$(yarn cache dir)/.tmp"
          yarn install

      - name: Install Ruby dependencies
        working-directory: sample
        run: bundle install

      # A tvOS app must get the opt-out error, not silently lose this pod (see the podspec's platforms).
      - name: Check that a tvOS Podfile stops with the iOS-only error
        if: matrix.ios_deps == 'spm'
        working-directory: sample/ios
        run: |
          sed -i '' "s/^platform :ios, '15.6'/platform :tvos, '15.6'/" Podfile
          if bundle exec pod install > tvos-pod-install.log 2>&1; then
            cat tvos-pod-install.log
            echo "pod install succeeded for a tvOS target; it should stop with the iOS-only error."
            exit 1
          fi
          git checkout -- Podfile
          grep -F '[mParticle] Swift Package Manager mode is iOS only' tvos-pod-install.log || { cat tvos-pod-install.log; exit 1; }

      - name: Build iOS sample app and run native unit tests
        working-directory: sample/ios
        run: |
          bundle exec pod install
          set -o pipefail && xcodebuild -workspace MParticleSample.xcworkspace \
          -configuration Debug \
          -scheme MParticleSample \
          -destination 'id=${{ steps.simulator.outputs.udid }}' \
          -derivedDataPath ios/build \
          -UseModernBuildSystem=YES \
          test \
          -only-testing:MParticleSampleTests/RCTConvertCommerceMappingTests \
          -only-testing:MParticleSampleTests/RoktNativeLayoutComponentViewSizingTests \
          -only-testing:MParticleSampleTests/RoktNativeLayoutComponentViewPropsTests \
          -only-testing:MParticleSampleTests/RNMParticleDuplicateSDKTests \
          -only-testing:MParticleSampleTests/RNMPRoktEventMapperTests \
          -only-testing:MParticleSampleTests/RNMPRoktConfigFactoryTests \
          -only-testing:MParticleSampleTests/RNMPRoktSwiftTests \
          | bundle exec xcpretty -k

      - name: Archive iOS sample app and check for a single copy of each SDK
        working-directory: sample/ios
        run: |
          set -o pipefail && xcodebuild -workspace MParticleSample.xcworkspace \
          -configuration Release \
          -scheme MParticleSample \
          -destination 'generic/platform=iOS' \
          -derivedDataPath ios/build \
          -archivePath ios/build/MParticleSample.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          archive \
          | bundle exec xcpretty -k
          ../../scripts/ios/check-single-copy.sh ios/build/MParticleSample.xcarchive/Products/Applications/MParticleSample.app

  pr-notify:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    needs:
      - trunk-check
      - android-unit-tests
      - android-lint
      - android-kotlin-lint
      - android-sample-app
      - ios-sample-app
      - js-tests
    name: Notify GChat
    uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@main
    secrets:
      gchat_webhook: ${{ secrets.GCHAT_PRS_WEBHOOK }}

  automerge-dependabot:
    name: 'Save PR Number for Dependabot Automerge'
    needs: [js-tests, android-unit-tests, android-lint, android-kotlin-lint]
    uses: mParticle/mparticle-workflows/.github/workflows/dependabot-save-pr-number.yml@main
