name: Release Publish

on:
  push:
    branches:
      - main
      - maintenance/*
    paths:
      - VERSION

permissions:
  contents: read

jobs:
  react-tests:
    name: Run React Native Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install node modules
        run: yarn install

      - name: Run tests
        run: yarn test

  android-unit-tests:
    name: Run Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Android Unit Tests
        run: cd android && ./gradlew test

  publish:
    name: Publish to npm and Create GitHub Release
    runs-on: ubuntu-latest
    needs: [react-tests, android-unit-tests]
    permissions:
      contents: write
      id-token: write # Required for npm OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install node modules
        run: yarn install

      - name: Build SDK
        run: yarn build

      - name: Extract release notes from CHANGELOG.md
        id: release-notes
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d
        with:
          release_notes_file: RELEASE_NOTES.md

      # A maintenance release must not pull `latest` back below a newer major.
      - name: Resolve npm dist-tag
        id: dist-tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          current=$(npm view react-native-mparticle dist-tags.latest)
          # ponytail: sort -V is fine while we never publish pre-releases
          if [ "$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n1)" = "$VERSION" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest-${VERSION%%.*}" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish --provenance --tag "$DIST_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          IS_LATEST: ${{ steps.dist-tag.outputs.latest }}
        run: >-
          gh release create "$RELEASE_VERSION"
          --title "$RELEASE_VERSION"
          --notes-file RELEASE_NOTES.md
          --target "$RELEASE_COMMIT"
          --latest="$IS_LATEST"
