buildscript {
    ext.kotlin_version = "2.4.10"
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id "org.sonarqube" version "7.5.0.8588"
    id "org.jlleitschuh.gradle.ktlint" version "14.2.0"
}

sonarqube {
    properties {
        property "sonar.projectKey", "react-native-mparticle"
        property "sonar.organization", "mparticle"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

def isNewArchitectureEnabled() {
    // React Native 0.80+ uses this standard detection approach
    return project.hasProperty("newArchEnabled") && project.newArchEnabled.toBoolean()
}

def supportsNamespace() {
    def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
    def major = parsed[0].toInteger()
    def minor = parsed[1].toInteger()

    // Namespace support was added in 7.3.0
    if (major == 7 && minor >= 3) {
        return true
    }

    return major >= 8
}

apply plugin: 'org.jlleitschuh.gradle.ktlint'
apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    if (supportsNamespace()) {
        namespace 'com.mparticle.react'
        buildFeatures {
            buildConfig = true
        }
        sourceSets {
            main {
                manifest.srcFile "src/main/AndroidManifestNew.xml"
            }
        }
    }
    compileSdkVersion 37

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 37
        versionCode 2
        versionName "2.0.0"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }
    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ['src/newarch/java']
                kotlin.srcDirs += ['src/newarch/java']
            } else {
                java.srcDirs += ['src/oldarch/java']
                kotlin.srcDirs += ['src/oldarch/java']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    adbOptions {
       timeOutInMs 10 * 60 * 1000
   }
}

// Kotlin Gradle Plugin 2.x removed the `android.kotlinOptions` DSL in favor of
// this top-level block.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

repositories {
    mavenCentral()
    google()
}

ktlint {
    outputToConsole = true
    verbose = true
}

dependencies {
    api 'com.facebook.react:react-android:+'

    //
    // In your app, you should include mParticle core like this:
    //
    //   compile 'com.mparticle:android-core:REPLACEME'
    //
    // (See https://github.com/mparticle/mparticle-android-sdk for the latest version)
    //
    api 'com.mparticle:android-core:[6.0.4, 7.0)'
    compileOnly 'com.mparticle:android-rokt-kit:[6.0.4, 7.0)'

    //
    // And, if you want to include kits, you can do so as follows:
    //
    //   compile 'com.mparticle:android-example-kit:REPLACEME'
    //
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"

    testImplementation 'org.mockito:mockito-core:5.23.0'
    androidTestImplementation 'org.mockito:mockito-android:5.23.0'
    testImplementation 'androidx.annotation:annotation:1.9.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation files('libs/java-json.jar')

    testImplementation 'com.mparticle:android-core:6.0.4'
    testCompileOnly 'com.mparticle:android-rokt-kit:6.0.4'
    testImplementation("com.facebook.react:react-android:+")
}
